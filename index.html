<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Overhead</title>
<meta name="description" content="Wat vliegt er nu boven je huis, getekend op schaal van de spanwijdte.">

<style>
/* Layout: een specimenbord. Alle toestellen in bovenaanzicht op één gedeelde schaal, groot naar klein, met een kaartje eronder. */
:root{
  --floor:#e9eef0;        /* hangarvloer */
  --sheet:#f6f8f9;
  --ink:#14222e;
  --muted:#5d6c76;
  --rule:#c9d3d8;
  --plane:#173049;        /* romp en vleugels */
  --plane2:#3b5a78;       /* motoren, staart */
  --accent:#d2541c;       /* signaaloranje, schaalbalk en focus */
  --climb:#2f7a4a; --descend:#a8650a; --cruise:#2d6a9a;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --floor:#0f171d; --sheet:#152129; --ink:#e4ecef; --muted:#90a1aa; --rule:#2a3a44;
  --plane:#d9e6ee; --plane2:#8fb1cc; --accent:#f07a3d;
  --climb:#69c08a; --descend:#e2a54a; --cruise:#79b4e2; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--floor);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1400px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.eyebrow{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,48px);line-height:1;margin:4px 0 0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--climb);margin-right:6px;vertical-align:1px;animation:pulse 2s infinite}
.meta .stale::before{background:var(--descend);animation:none}
@keyframes pulse{50%{opacity:.25}}

.gear{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.gear:hover{border-color:var(--ink)}
.gear svg{width:22px;height:22px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.board{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:22px 18px 26px;position:relative;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:var(--grid,40px) var(--grid,40px);background-position:-1px -1px}
.board::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--sheet);opacity:.82;pointer-events:none}
.board>*{position:relative}
.scalebar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:18px}
.scalebar i{display:block;height:6px;border:2px solid var(--accent);border-top:none}

.fleet{display:flex;flex-wrap:wrap;gap:30px 26px;align-items:flex-end;justify-content:center}
.ac{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:150px;max-width:100%}
.ac svg{display:block;overflow:visible;max-width:100%;height:auto;transition:transform .3s}
.ac:hover svg{transform:translateY(-3px)}
.ac.ph{min-width:0}
.ac.ph .card{width:100%}
.photo{margin:0;position:relative;width:100%;border-radius:6px;overflow:hidden;background:var(--rule)}
.photo img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;transition:transform .4s}
.ac.ph:hover .photo img{transform:scale(1.03)}
.photo figcaption{position:absolute;right:6px;bottom:6px;font:10.5px/1.3 var(--mono);background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:3px;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo figcaption a{color:#fff;text-decoration:none}
.ruler{display:grid;justify-items:start;gap:3px;width:100%;font:11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ruler i{height:7px;border:2px solid var(--accent);border-top:none;flex:none}
.ruler span{white-space:nowrap}
.silbox{aspect-ratio:3/2;display:grid;place-items:center;background:color-mix(in srgb,var(--plane2) 14%,var(--sheet))}
.silbox svg{max-width:85%;max-height:85%}
.card{width:168px;border-top:2px solid var(--ink);padding-top:7px;display:grid;gap:3px;font-size:13px}
.cs{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cs b{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.01em;line-height:1}
.cs span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.model{font-weight:600}
.airline{color:var(--muted);font-size:12px;margin-top:-2px}
.route{font-family:var(--mono);font-size:12.5px}
.route small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted)}
.alt{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;display:grid;justify-items:start;gap:5px;margin-top:2px}
.trend{display:inline-flex;align-items:center;gap:4px;font-family:var(--body);font-size:11.5px;font-weight:600;padding:1px 7px 1px 5px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.trend svg{width:12px;height:12px}
.t-climb{color:var(--climb)}.t-descend{color:var(--descend)}.t-cruise{color:var(--cruise)}.t-ground{color:var(--muted)}

.empty{text-align:center;padding:60px 16px;color:var(--muted);max-width:46ch;margin:0 auto}
.empty b{display:block;font-family:var(--display);font-size:26px;color:var(--ink);margin-bottom:6px}
footer{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
footer a{color:inherit}

/* Instellingen */
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:0;width:min(440px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,28,.45)}
.dlg{padding:22px;display:grid;gap:16px}
.dlg h2{font-family:var(--display);font-size:26px;margin:0}
.field{display:grid;gap:5px;font-size:13.5px;font-weight:500}
.field small{font-weight:400;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--floor);border:1px solid var(--rule);border-radius:6px;padding:9px 10px;width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.results{display:grid;gap:4px}
.results button{text-align:left;background:var(--floor);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;color:var(--ink);font:inherit;cursor:pointer}
.results button small{color:var(--muted);display:block;font-size:12px}
.btns{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:6px;padding:9px 16px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:560px){
  .fleet{gap:26px 12px;justify-content:space-between}
  .ac{width:calc(50% - 6px);min-width:0}
  .card{width:100%}
  .cs b{font-size:18px}
  .board{padding:16px 12px 20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="where">Locatie instellen</div>
      <h1 id="title">Wat vliegt er boven ons?</h1>
      <div class="meta"><span id="status">laden…</span><span id="count"></span></div>
    </div>
    <button class="gear" id="gear" type="button" aria-label="Instellingen">

    </button>
  </header>

  <main class="board" id="board">
    <div class="scalebar" id="scalebar"></div>
    <div class="fleet" id="fleet"><div class="empty"><b>Luchtruim afluisteren…</b>Even geduld.</div></div>
  </main>

  <footer>Posities: <a href="https://adsb.lol" target="_blank" rel="noopener">adsb.lol</a> / <a href="https://adsb.fi" target="_blank" rel="noopener">adsb.fi</a> · Routes: <a href="https://www.adsbdb.com" target="_blank" rel="noopener">adsbdb</a> · Foto's: <a href="https://www.planespotters.net" target="_blank" rel="noopener">planespotters.net</a>, © de vermelde fotografen · De oranje lat toont de spanwijdte op schaal.</footer>
</div>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog">
    <h2>Instellingen</h2>
    <label class="field">Titel
      <input id="f-title" placeholder="Wat vliegt er boven ons?">
      <small>Bijvoorbeeld "Boven het huis van Jos".</small>
    </label>
    <label class="field">Zoek een plaats
      <input id="f-search" placeholder="Gemeente of straat" autocomplete="off">
    </label>
    <div class="results" id="results"></div>
    <div class="row">
      <label class="field">Breedtegraad<input id="f-lat" inputmode="decimal"></label>
      <label class="field">Lengtegraad<input id="f-lon" inputmode="decimal"></label>
    </div>
    <label class="field">Straal: <span id="f-radv">40 km</span>
      <input id="f-rad" type="range" min="5" max="100" step="5">
    </label>
    <label class="field">Afbeeldingen
      <select id="f-view"><option value="foto">Foto's van het toestel</option><option value="silhouet">Silhouetten op schaal</option></select>
    </label>
    <button class="btn ghost" type="button" id="f-geo">Gebruik de locatie van dit toestel</button>
    <p class="hint" id="f-msg"></p>
    <div class="btns">
      <button class="btn ghost" value="cancel" type="submit">Annuleer</button>
      <button class="btn" id="f-save" type="button">Opslaan</button>
    </div>
  </form>
</dialog>

/* ---------- Instellingen: URL-parameters > opgeslagen > standaard ---------- */
const DEFAULTS = { title: "", place: "Dessel", lat: 51.2387, lon: 5.1159, radius: 40, view: "foto" };
function loadCfg() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("overhead.cfg") || "{}"); } catch (e) {}
  const cfg = { ...DEFAULTS, ...saved };
  const p = new URLSearchParams(location.search);
  if (p.has("lat") && p.has("lon")) { cfg.lat = +p.get("lat"); cfg.lon = +p.get("lon"); cfg.place = p.get("plaats") || ""; }
  if (p.has("straal")) cfg.radius = +p.get("straal");
  if (p.has("titel")) cfg.title = p.get("titel");
  if (p.has("weergave")) cfg.view = p.get("weergave") === "silhouet" ? "silhouet" : "foto";
  return cfg;
}
let cfg = loadCfg();

  EC30:["Airbus H130",10.7,12.6,"heli"],AS50:["Airbus H125",10.7,12.9,"heli"],NH90:["NH90",16.3,19.6,"heli"],R44:["Robinson R44",10.1,11.7,"heli"],R22:["Robinson R22",7.7,8.8,"heli"],
  H47:["Boeing CH-47 Chinook",18.3,30.1,"heli"],AS3B:["Eurocopter Cougar",15.6,19.5,"heli"],AS32:["Eurocopter Super Puma",15.6,18.7,"heli"],H64:["Boeing AH-64 Apache",14.6,17.7,"heli"],B06:["Bell 206",10.2,11.8,"heli"],B407:["Bell 407",10.7,12.7,"heli"],H500:["MD 500",8.1,9.4,"heli"]
};
// Valt terug op de ADS-B-categorie als het type onbekend is
const CAT = { A1:["Klein vliegtuig",11,8.3,"ga"], A2:["Zakenvliegtuig",18,17,"tail"], A3:["Verkeersvliegtuig",35,38,"jet"], A4:["Verkeersvliegtuig",38,47,"jet"], A5:["Groot verkeersvliegtuig",62,65,"jet"], A7:["Helikopter",11,13,"heli"], B1:["Zweefvliegtuig",15,7,"ga"] };
function spec(a) {
  const t = T[a.type];
  if (t) return { model: t[0], span: t[1], len: t[2], shape: t[3], known: true };
  const c = CAT[a.category] || ["", 30, 32, "jet"];
  return { model: a.desc ? titleCase(a.desc) : (a.type || c[0] || "Onbekend type"), span: c[1], len: c[2], shape: c[3], known: false };
}
function titleCase(s) { return s.toLowerCase().replace(/\b([a-z])/g, (m) => m.toUpperCase()).replace(/\b(Ii|Iii|Iv)\b/g, (m) => m.toUpperCase()); }

/* ---------- Bovenaanzicht in meters (neus boven, y loopt naar de staart) ---------- */
function plan(sp) {
  const s = sp.span, L = sp.len, h = s / 2;
  const P = (pts) => `<path d="M${pts.map((p) => p.map((v) => v.toFixed(2)).join(" ")).join(" L")}Z"/>`;
  const mirror = (pts) => pts.map(([x, y]) => [-x, y]);
  let body = "", extra = "";
  const fuselage = (fw, tailW = 0.12) => {
    const n = fw * 1.6; // neuslengte
    return `<path d="M0 0 C${fw*0.45} 0 ${fw/2} ${n*0.5} ${fw/2} ${n} L${fw/2} ${L*0.74} L${fw*tailW} ${L} L${-fw*tailW} ${L} L${-fw/2} ${L*0.74} L${-fw/2} ${n} C${-fw/2} ${n*0.5} ${-fw*0.45} 0 0 0Z"/>`;
  };
  const wing = (fw, y0, cr, ct, sweepDeg, span = h) => {
    const dx = (span - fw / 2) * Math.tan(sweepDeg * Math.PI / 180);
    const r = [[fw / 2, y0], [span, y0 + dx], [span, y0 + dx + ct], [fw / 2, y0 + cr]];
    return P(r) + P(mirror(r));
  };
  const tail = (fw, hs, cr, sweepDeg) => {
    const y0 = L - cr - L * 0.015;
    return wing(fw * 0.5, y0, cr, cr * 0.4, sweepDeg, hs / 2);
  };
  const leAt = (x, y0, fw, sweep) => y0 + (x - fw / 2) * Math.tan(sweep * Math.PI / 180);

  if (sp.shape === "heli") {
    const r = h, fw = L * 0.17;
    body = `<ellipse cx="0" cy="${L*0.24}" rx="${fw/2}" ry="${L*0.2}"/><path d="M${-fw*0.12} ${L*0.4} L${fw*0.12} ${L*0.4} L${fw*0.08} ${L} L${-fw*0.08} ${L}Z"/><path d="M${-fw*0.7} ${L*0.94} L${fw*0.7} ${L*0.94} L${fw*0.7} ${L*0.98} L${-fw*0.7} ${L*0.98}Z"/>`;
    extra = `<circle cx="0" cy="${L*0.24}" r="${r}" fill="none" stroke="var(--plane2)" stroke-width="${Math.max(0.12, s*0.012)}" stroke-dasharray="${s*0.05} ${s*0.03}" opacity=".8"/>
      <path d="M${-r} ${L*0.24} L${r} ${L*0.24} M0 ${L*0.24-r} L0 ${L*0.24+r}" stroke="var(--plane2)" stroke-width="${s*0.018}" opacity=".9"/>`;
    return { svg: extra + body, top: L * 0.24 - r, bottom: Math.max(L, L * 0.24 + r), left: -r, right: r };
  }
  if (sp.shape === "ga") {
    const fw = L * 0.14, y0 = L * 0.27, cr = Math.max(1.3, s * 0.13);
    body = fuselage(fw, 0.1) + wing(fw, y0, cr, cr * 0.75, 0) + tail(fw, s * 0.34, L * 0.11, 4);
    extra = `<path d="M${-s*0.09} -0.15 L${s*0.09} -0.15" stroke="var(--plane2)" stroke-width="${s*0.016}" stroke-linecap="round"/>`;
  } else if (sp.shape === "fighter") {
    const fw = L * 0.09, y0 = L * 0.38;
    const r = [[fw / 2, y0], [h, L * 0.72], [h, L * 0.78], [fw / 2, L * 0.76]];
    body = fuselage(fw, 0.25) + P(r) + P(mirror(r)) + tail(fw, s * 0.55, L * 0.12, 35);
  } else if (sp.shape === "prop" || sp.shape === "prop4") {
    const fw = L * 0.1, y0 = L * 0.37, cr = L * 0.11;
    body = fuselage(fw, 0.15) + wing(fw, y0, cr, cr * 0.6, 2) + tail(fw, s * 0.3, L * 0.11, 8);
    const xs = sp.shape === "prop4" ? [s * 0.17, s * 0.31] : [s * 0.18];
    xs.forEach((x) => {
      const nw = fw * 0.33, top = y0 - L * 0.1, bot = y0 + cr * 1.1;
      [x, -x].forEach((cx) => {
        extra += `<rect x="${cx - nw/2}" y="${top}" width="${nw}" height="${bot - top}" rx="${nw/2}" fill="var(--plane2)"/>`;
        extra += `<path d="M${cx - s*0.065} ${top - 0.2} L${cx + s*0.065} ${top - 0.2}" stroke="var(--plane2)" stroke-width="${s*0.008}" stroke-linecap="round"/>`;
      });
    });
  } else {
    // straalvliegtuigen
    const wide = s > 45, fw = L * (wide ? 0.088 : 0.1), sweep = sp.shape === "tail" ? 27 : (wide ? 31 : 25);
    const y0 = L * (sp.shape === "tail" ? 0.4 : 0.36), cr = L * (wide ? 0.2 : 0.19);
    body = fuselage(fw) + wing(fw, y0, cr, cr * 0.26, sweep) + tail(fw, s * (sp.shape === "tail" ? 0.36 : 0.33), L * 0.1, 33);
    // winglets / sharklets: klein stukje aan de tip
    if (sp.shape === "tail") {
      const ew = fw * 0.42, el = L * 0.12, ey = L * 0.66;
      [1, -1].forEach((sgn) => extra += `<rect x="${sgn > 0 ? fw/2 - 0.1 : -fw/2 - ew + 0.1}" y="${ey}" width="${ew}" height="${el}" rx="${ew/2}" fill="var(--plane2)"/>`);
    } else {
      const xs = sp.shape === "jet4" ? [s * 0.2, s * 0.35] : [s * (wide ? 0.17 : 0.18)];
      const ew = wide ? Math.max(2.4, s * 0.05) : Math.max(1.6, s * 0.058), el = cr * (wide ? 0.62 : 0.72);
      xs.forEach((x) => {
        const yle = leAt(x, y0, fw, sweep);
        [x, -x].forEach((cx) => extra += `<rect x="${cx - ew/2}" y="${yle - el*0.62}" width="${ew}" height="${el}" rx="${ew*0.4}" fill="var(--plane2)"/>`);
      });
    }
  }
  return { svg: body + extra, top: -0.5, bottom: L + 0.3, left: -h, right: h };
}

function drawPlane(sp, k) {
  const g = plan(sp);
  const pad = 0.6;
  const w = (g.right - g.left + pad * 2), hgt = (g.bottom - g.top + pad * 2);
  return `<svg width="${(w*k).toFixed(1)}" height="${(hgt*k).toFixed(1)}" viewBox="${g.left - pad} ${g.top - pad} ${w} ${hgt}" role="img" aria-label="${esc(sp.model)}, spanwijdte ${sp.span} meter"><g fill="var(--plane)">${g.svg}</g></svg>`;
}

/* ---------- Trend en hoogte ---------- */
const ICON = {
  climb: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5 9.5 2M4.5 2h5v5"/></svg>',
  descend: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2.5 9.5 10M9.5 5v5h-5"/></svg>',
  cruise: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6h9M7 2.5 10.5 6 7 9.5"/></svg>',
  ground: ''
};
function trend(a) {
  if (a.onGround) return ["ground", "aan de grond"];
  const r = a.rate;
  if (r == null) return ["cruise", "cruise"];
  if (r > 300) return ["climb", "stijgt"];
  if (r < -300) return ["descend", "daalt"];
  return ["cruise", "cruise"];
}
function altText(a) {
  if (a.onGround) return "grond";
  if (a.alt == null) return "—";
  const ft = Math.round(a.alt), m = Math.round(ft * 0.3048 / 10) * 10;
  return ft >= 6000 ? `FL${String(Math.round(ft / 100)).padStart(3, "0")} · ${nf.format(m)} m` : `${nf.format(ft)} ft · ${nf.format(m)} m`;
}
function routeHtml(a) {
  if (!a.route) return `<div class="route"><span style="color:var(--muted)">route onbekend</span></div>`;
  const f = a.route.from, t = a.route.to;
  return `<div class="route">${esc(f.iata)} → ${esc(t.iata)}<small>${esc(f.city || "")} naar ${esc(t.city || "")}</small></div>`;
}

/* ---------- Tekenen ---------- */
let last = null, lastOk = 0;
function render(data) {
  const fleet = $("fleet");
  const list = (data?.aircraft || []).map((a) => ({ ...a, sp: spec(a) }));
  $("count").textContent = data ? `${list.length} toestel${list.length === 1 ? "" : "len"} binnen ${cfg.radius} km` : "";
  if (!list.length) {
    fleet.innerHTML = `<div class="empty"><b>Het luchtruim is even leeg</b>Niets binnen ${cfg.radius} km. Over een minuut kijken we opnieuw.</div>`;
    $("scalebar").innerHTML = "";
    return;
  }
  list.sort((a, b) => b.sp.span - a.sp.span || a.dist - b.dist);
  // Eén schaal voor alles: het grootste toestel krijgt ongeveer de helft van de breedte, hoogstens 380 px
  const avail = fleet.clientWidth || 360;
  const maxSpan = Math.max(...list.map((a) => a.sp.span));
  const photos = cfg.view !== "silhouet";
  const narrow = avail < 560;
  // Met foto's krijgt het grootste toestel meer ruimte; kleine foto's houden een minimumbreedte en de oranje lat toont dan de echte maat
  const k = (photos ? (narrow ? avail * 0.9 : Math.min(520, avail * 0.6)) : (narrow ? avail * 0.46 : Math.min(380, avail * 0.48))) / maxSpan; // px per meter
  const minW = narrow ? (avail - 12) / 2 : 210;
  const ten = 10 * k;
  $("scalebar").innerHTML = `<i style="width:${ten.toFixed(1)}px"></i>10 m · alle toestellen op dezelfde schaal`;
  $("board").style.setProperty("--grid", `${ten.toFixed(1)}px`);

  fleet.innerHTML = list.map((a) => {
    const [tk, tl] = trend(a);
    const name = a.callsign || a.reg || a.hex.toUpperCase();
    const airline = a.airline || a.operator;
    const spanTxt = a.sp.span.toFixed(1).replace(".", ",").replace(",0", "") + " m";
    const fitK = (bw) => Math.min((bw * 0.82) / (a.sp.span + 1.2), (bw * 0.56) / (Math.max(a.sp.len, a.sp.shape === "heli" ? a.sp.span : 0) + 1.2));
    const w = photos ? Math.min(avail, Math.max(minW, a.sp.span * k)) : 0;
    const pic = photos
      ? `<figure class="photo">${a.photo ? `<img src="${esc(a.photo.src)}" alt="${esc(a.sp.model)} ${esc(a.reg || "")}" loading="lazy" referrerpolicy="no-referrer">${a.photo.by ? `<figcaption>© <a href="${esc(a.photo.link)}" target="_blank" rel="noopener">${esc(a.photo.by)}</a> · planespotters</figcaption>` : ""}` : `<div class="silbox">${drawPlane(a.sp, fitK(w))}</div>`}</figure>
         <div class="ruler" title="Spanwijdte op schaal"><i style="width:${(a.sp.span * k).toFixed(1)}px"></i><span>${spanTxt}</span></div>`
      : drawPlane(a.sp, k);
    return `<article class="ac${w ? " ph" : ""}"${w ? ` style="width:${w.toFixed(0)}px"` : ""}>
      ${pic}
      <div class="card">
        <div class="cs"><b>${esc(name)}</b><span>${a.dist.toFixed(0)} km</span></div>
        ${airline ? `<div class="airline">${esc(airline)}</div>` : ""}
        <div class="model">${esc(a.sp.model)}</div>
        ${routeHtml(a)}
        <div class="alt"><span>${altText(a)}</span><span class="trend t-${tk}">${ICON[tk]}${tl}</span></div>
      </div>
    </article>`;
  }).join("");
}

function header() {
  $("title").textContent = cfg.title || "Wat vliegt er boven ons?";
  $("where").textContent = `${cfg.place ? cfg.place + " · " : ""}${cfg.lat.toFixed(3).replace(".", ",")}° N, ${cfg.lon.toFixed(3).replace(".", ",")}° O`;
  document.title = cfg.title || "Overhead";
}

async function load() {
  try {
    const r = await fetch(`/api/aircraft?lat=${cfg.lat}&lon=${cfg.lon}&radius=${cfg.radius}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Fout bij ophalen");
    last = j; lastOk = Date.now();
    render(j);
    setStatus();
  } catch (e) {
    setStatus(e.message);
    if (!last) $("fleet").innerHTML = `<div class="empty"><b>Geen verbinding met de bronnen</b>${esc(e.message)} We proberen het over een halve minuut opnieuw.</div>`;
  }
}
function setStatus(err) {
  const s = $("status");
  const t = lastOk ? new Date(lastOk).toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" }) : "—";
  s.className = err ? "live stale" : "live";
  s.textContent = err ? `laatst bijgewerkt ${t}` : `live · ${t}`;
}

/* ---------- Instellingen-dialoog ---------- */
const dlg = $("dlg");
function openSettings() {
  $("f-title").value = cfg.title; $("f-lat").value = cfg.lat; $("f-lon").value = cfg.lon;
  $("f-rad").value = cfg.radius; $("f-view").value = cfg.view; $("f-radv").textContent = cfg.radius + " km";
  $("f-search").value = cfg.place || ""; $("results").innerHTML = ""; $("f-msg").textContent = "";
  dlg.showModal();
}
$("gear").addEventListener("click", openSettings);
$("f-rad").addEventListener("input", (e) => $("f-radv").textContent = e.target.value + " km");
let pendingPlace = cfg.place, searchT;
$("f-search").addEventListener("input", (e) => {
  clearTimeout(searchT);
  const q = e.target.value.trim();
  if (q.length < 2) { $("results").innerHTML = ""; return; }
  searchT = setTimeout(async () => {
    try {
      const r = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
      const j = await r.json();
      $("results").innerHTML = (j.results || []).map((p, i) => `<button type="button" data-i="${i}">${esc(p.name)}<small>${esc(p.region)}</small></button>`).join("") || `<p class="hint">Niets gevonden.</p>`;
      $("results").querySelectorAll("button").forEach((b) => b.onclick = () => {
        const p = j.results[+b.dataset.i];
        $("f-lat").value = p.lat.toFixed(4); $("f-lon").value = p.lon.toFixed(4);
        pendingPlace = p.name; $("f-search").value = p.name; $("results").innerHTML = "";
      });
    } catch (err) { $("results").innerHTML = `<p class="hint">Zoeken lukt nu niet.</p>`; }
  }, 300);
});
$("f-geo").addEventListener("click", () => {
  if (!navigator.geolocation) { $("f-msg").textContent = "Dit toestel kan zijn locatie niet doorgeven."; return; }
  $("f-msg").textContent = "Locatie opvragen…";
  navigator.geolocation.getCurrentPosition(
    (p) => { $("f-lat").value = p.coords.latitude.toFixed(4); $("f-lon").value = p.coords.longitude.toFixed(4); pendingPlace = ""; $("f-search").value = ""; $("f-msg").textContent = "Locatie ingevuld."; },
    () => { $("f-msg").textContent = "Toegang tot de locatie is geweigerd. Zoek de plaats op naam."; },
    { timeout: 10000 }
  );
});
$("f-save").addEventListener("click", () => {
  const lat = parseFloat(String($("f-lat").value).replace(",", ".")), lon = parseFloat(String($("f-lon").value).replace(",", "."));
  if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { $("f-msg").textContent = "Vul een geldige breedte- en lengtegraad in."; return; }
  cfg = { title: $("f-title").value.trim(), place: pendingPlace || "", lat, lon, radius: +$("f-rad").value, view: $("f-view").value };
  saveCfg(); header(); dlg.close(); last = null;
  $("fleet").innerHTML = `<div class="empty"><b>Luchtruim afluisteren…</b>Even geduld.</div>`;
  history.replaceState(null, "", location.pathname);
  load();
});

/* Scherm aan houden op een tablet */
async function wake() { try { await navigator.wakeLock?.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) { wake(); load(); } });

let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => last && render(last), 150); });
header(); load(); wake();
setInterval(load, 30000);
})();
</script>
</body>
</html>

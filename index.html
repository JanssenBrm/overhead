<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e2e1dc">
<title>Overhead</title>
<meta name="description" content="Wat vliegt er nu boven je huis, als een prent op schaal van de spanwijdte.">

<style>
/* Layout: één prent op grijs papier. Kopregel met hairline, daaronder een collage van toestellen in zijaanzicht,
   breedte volgens spanwijdte, elk met een gecentreerd cursief bijschrift. Past zich aan tot alles op één scherm staat. */
:root{
  --paper:#e2e1dc;
  --paper-edge:#d3d2cc;
  --ink:#1f1e1b;
  --soft:#4b4943;
  --rule:#8d8b84;
  --ghost:#b9b7af;
  --serif:"IM Fell English",Georgia,"Times New Roman",serif;
  --caps:"IM Fell English SC","IM Fell English",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#1c1c1a; --paper-edge:#141413; --ink:#e9e6dd; --soft:#b4b0a5; --rule:#6b6862; --ghost:#3a3936; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);
  background-image:radial-gradient(ellipse at 50% 40%,transparent 55%,var(--paper-edge) 100%);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.page{min-height:100%;display:flex;flex-direction:column;max-width:1500px;margin:0 auto;
  padding-block:clamp(14px,3vh,34px) clamp(12px,2.5vh,28px);
  padding-left:max(16px,env(safe-area-inset-left,0px),3vw);padding-right:max(16px,env(safe-area-inset-right,0px),3vw)}

header{display:flex;align-items:baseline;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);padding-bottom:6px}
.kop{font-family:var(--caps);font-size:clamp(13px,1.5vw,18px);letter-spacing:.14em;color:var(--soft)}
.kop b{font-weight:400;color:var(--ink);letter-spacing:.16em;margin-right:.9em}
.kop .sep{margin:0 .5em}
.right{display:flex;align-items:baseline;gap:14px}
.when{font-size:clamp(15px,1.7vw,21px);font-variant-numeric:lining-nums tabular-nums}
.gear{background:none;border:0;padding:4px;margin:-4px;color:var(--soft);opacity:.55;cursor:pointer;align-self:center}
.gear:hover,.gear:focus-visible{opacity:1}
.gear svg{width:18px;height:18px;display:block}
:focus-visible{outline:1px dashed var(--ink);outline-offset:3px}

main{flex:1;display:flex;align-items:center;justify-content:center;padding-block:clamp(10px,3vh,36px);min-height:0}
.collage{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:var(--gy,18px) var(--gx,26px);max-width:100%}
.ac{display:flex;flex-direction:column;align-items:center;max-width:100%;text-align:center}
.ac img,.ac svg{display:block;max-width:100%;height:auto}
.ac img{
  -webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 54%,#000 52%,transparent 100%);
          mask-image:radial-gradient(ellipse 62% 58% at 50% 54%,#000 52%,transparent 100%);
  filter:saturate(.92) contrast(1.03)}
.cap{margin-top:calc(var(--s,1) * -2px);display:grid;line-height:1.15;font-size:calc(var(--s,1) * 13px)}
.cap b{font-family:var(--caps);font-weight:400;font-size:1.22em;letter-spacing:.08em}
.cap i{color:var(--soft)}
.cap a{color:inherit;text-decoration:none}
.credit{font-size:.78em;opacity:.7}

.empty{text-align:center;color:var(--soft);font-size:20px;font-style:italic;max-width:38ch;line-height:1.4}
.empty b{display:block;font-family:var(--caps);font-style:normal;font-weight:400;color:var(--ink);font-size:24px;letter-spacing:.08em;margin-bottom:6px}
footer{border-top:1px solid var(--rule);padding-top:6px;display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;
  font-style:italic;font-size:12.5px;color:var(--soft)}
footer a{color:inherit}

/* Instellingen */
dialog{border:1px solid var(--rule);border-radius:2px;background:var(--paper);color:var(--ink);padding:0;width:min(440px,calc(100vw - 32px));box-shadow:0 18px 50px rgba(0,0,0,.28);font-family:var(--serif)}
dialog::backdrop{background:rgba(20,20,18,.45)}
.dlg{padding:22px;display:grid;gap:14px}
.dlg h2{font-family:var(--caps);font-weight:400;letter-spacing:.12em;font-size:22px;margin:0;border-bottom:1px solid var(--rule);padding-bottom:6px}
.field{display:grid;gap:4px;font-size:16px}
.field small{color:var(--soft);font-style:italic;font-size:14px}
input,select{font:16px/1.3 Georgia,serif;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:6px 2px;width:100%}
input[type=range]{border:0;padding:0;accent-color:var(--ink)}
select{background:var(--paper)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.results{display:grid;gap:2px}
.results button{text-align:left;background:none;border:0;border-bottom:1px dotted var(--rule);padding:6px 2px;color:var(--ink);font:16px var(--serif);cursor:pointer}
.results button small{color:var(--soft);display:block;font-style:italic;font-size:13.5px}
.btns{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.btn{font:15px var(--caps);letter-spacing:.1em;padding:8px 16px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.hint{font-size:14px;color:var(--soft);font-style:italic;margin:0}
@media (min-width:700px){.page{height:100%}main{overflow:hidden}}
@media (prefers-reduced-motion:no-preference){.ac{animation:in .6s ease both}@keyframes in{from{opacity:0}}}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="kop"><b id="title">OVERHEAD</b><span id="radiusTxt">BINNEN 40 KM</span><span class="sep">·</span>NU IN DE LUCHT</div>

      </button>

  <main id="main"><div class="collage" id="fleet"><div class="empty"><b>Het luchtruim wordt afgeluisterd</b>Een ogenblik geduld.</div></div></main>

</div>

<dialog id="dlg">
  <form class="dlg" id="form" method="dialog">
    <h2>Instellingen</h2>
    <label class="field">Titel in de kop
      <input id="f-title" placeholder="Overhead">
      <small>Bijvoorbeeld "Boven Dessel" of een naam.</small>
    </label>
    <label class="field">Zoek een plaats
      <input id="f-search" placeholder="Gemeente of straat" autocomplete="off">
    </label>
    <div class="results" id="results"></div>
    <div class="row">
      <label class="field">Breedtegraad<input id="f-lat" inputmode="decimal"></label>
      <label class="field">Lengtegraad<input id="f-lon" inputmode="decimal"></label>
    </div>
    <label class="field">Straal: <span id="f-radv">40 km</span>
      <input id="f-rad" type="range" min="5" max="100" step="5">
    </label>
    <label class="field">Afbeeldingen
      <select id="f-view"><option value="foto">Foto's van het toestel</option><option value="silhouet">Getekende silhouetten</option></select>
    </label>
    <button class="btn ghost" type="button" id="f-geo">Gebruik de locatie van dit toestel</button>
    <p class="hint" id="f-msg"></p>
    <div class="btns">
      <button class="btn ghost" value="cancel" type="submit">Annuleer</button>
      <button class="btn" id="f-save" type="button">Opslaan</button>
    </div>
  </form>
</dialog>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = new Intl.NumberFormat("nl-BE");

/* ---------- Instellingen: URL-parameters > opgeslagen > standaard ---------- */
const DEFAULTS = { title: "", place: "Dessel", lat: 51.2387, lon: 5.1159, radius: 40, view: "foto" };
function loadCfg() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("overhead.cfg") || "{}"); } catch (e) {}
  const cfg = { ...DEFAULTS, ...saved };
  const p = new URLSearchParams(location.search);
  if (p.has("lat") && p.has("lon")) { cfg.lat = +p.get("lat"); cfg.lon = +p.get("lon"); cfg.place = p.get("plaats") || ""; }
  if (p.has("straal")) cfg.radius = +p.get("straal");
  if (p.has("titel")) cfg.title = p.get("titel");
  if (p.has("weergave")) cfg.view = p.get("weergave") === "silhouet" ? "silhouet" : "foto";
  return cfg;
}
let cfg = loadCfg();
function saveCfg() { try { localStorage.setItem("overhead.cfg", JSON.stringify(cfg)); } catch (e) {} }

/* ---------- Vliegtuigtypes: [model, spanwijdte m, lengte m, vorm] ----------

  P28A:["Piper PA-28",10.7,7.3,"ga"],P28R:["Piper Arrow",10.8,7.5,"ga"],PA46:["Piper Malibu",13.1,8.8,"ga"],SR20:["Cirrus SR20",11.7,7.9,"ga"],SR22:["Cirrus SR22",11.7,7.9,"ga"],

// Valt terug op de ADS-B-categorie als het type onbekend is
const CAT = { A1:["Klein vliegtuig",11,8.3,"ga"], A2:["Zakenvliegtuig",18,17,"tail"], A3:["Verkeersvliegtuig",35,38,"jet"], A4:["Verkeersvliegtuig",38,47,"jet"], A5:["Groot verkeersvliegtuig",62,65,"jet"], A7:["Helikopter",11,13,"heli"], B1:["Zweefvliegtuig",15,7,"ga"] };
function spec(a) {
  const t = T[a.type];
  if (t) return { model: t[0], span: t[1], len: t[2], shape: t[3], known: true };
  const c = CAT[a.category] || ["", 30, 32, "jet"];
  return { model: a.desc ? titleCase(a.desc) : (a.type || c[0] || "Onbekend type"), span: c[1], len: c[2], shape: c[3], known: false };
}
function titleCase(s) { return s.toLowerCase().replace(/\b([a-z])/g, (m) => m.toUpperCase()).replace(/\b(Ii|Iii|Iv)\b/g, (m) => m.toUpperCase()); }

/* ---------- Bovenaanzicht in meters (neus boven, y loopt naar de staart) ---------- */
function plan(sp) {
  const s = sp.span, L = sp.len, h = s / 2;
  const P = (pts) => `<path d="M${pts.map((p) => p.map((v) => v.toFixed(2)).join(" ")).join(" L")}Z"/>`;
  const mirror = (pts) => pts.map(([x, y]) => [-x, y]);
  let body = "", extra = "";
  const fuselage = (fw, tailW = 0.12) => {
    const n = fw * 1.6; // neuslengte
    return `<path d="M0 0 C${fw*0.45} 0 ${fw/2} ${n*0.5} ${fw/2} ${n} L${fw/2} ${L*0.74} L${fw*tailW} ${L} L${-fw*tailW} ${L} L${-fw/2} ${L*0.74} L${-fw/2} ${n} C${-fw/2} ${n*0.5} ${-fw*0.45} 0 0 0Z"/>`;
  };
  const wing = (fw, y0, cr, ct, sweepDeg, span = h) => {
    const dx = (span - fw / 2) * Math.tan(sweepDeg * Math.PI / 180);
    const r = [[fw / 2, y0], [span, y0 + dx], [span, y0 + dx + ct], [fw / 2, y0 + cr]];
    return P(r) + P(mirror(r));
  };
  const tail = (fw, hs, cr, sweepDeg) => {
    const y0 = L - cr - L * 0.015;
    return wing(fw * 0.5, y0, cr, cr * 0.4, sweepDeg, hs / 2);
  };
  const leAt = (x, y0, fw, sweep) => y0 + (x - fw / 2) * Math.tan(sweep * Math.PI / 180);

  if (sp.shape === "heli") {
    const r = h, fw = L * 0.17;
    body = `<ellipse cx="0" cy="${L*0.24}" rx="${fw/2}" ry="${L*0.2}"/><path d="M${-fw*0.12} ${L*0.4} L${fw*0.12} ${L*0.4} L${fw*0.08} ${L} L${-fw*0.08} ${L}Z"/><path d="M${-fw*0.7} ${L*0.94} L${fw*0.7} ${L*0.94} L${fw*0.7} ${L*0.98} L${-fw*0.7} ${L*0.98}Z"/>`;
    extra = `<circle cx="0" cy="${L*0.24}" r="${r}" fill="none" stroke="var(--plane2)" stroke-width="${Math.max(0.12, s*0.012)}" stroke-dasharray="${s*0.05} ${s*0.03}" opacity=".8"/>
      <path d="M${-r} ${L*0.24} L${r} ${L*0.24} M0 ${L*0.24-r} L0 ${L*0.24+r}" stroke="var(--plane2)" stroke-width="${s*0.018}" opacity=".9"/>`;
    return { svg: extra + body, top: L * 0.24 - r, bottom: Math.max(L, L * 0.24 + r), left: -r, right: r };
  }
  if (sp.shape === "ga") {
    const fw = L * 0.14, y0 = L * 0.27, cr = Math.max(1.3, s * 0.13);
    body = fuselage(fw, 0.1) + wing(fw, y0, cr, cr * 0.75, 0) + tail(fw, s * 0.34, L * 0.11, 4);
    extra = `<path d="M${-s*0.09} -0.15 L${s*0.09} -0.15" stroke="var(--plane2)" stroke-width="${s*0.016}" stroke-linecap="round"/>`;
  } else if (sp.shape === "fighter") {
    const fw = L * 0.09, y0 = L * 0.38;
    const r = [[fw / 2, y0], [h, L * 0.72], [h, L * 0.78], [fw / 2, L * 0.76]];
    body = fuselage(fw, 0.25) + P(r) + P(mirror(r)) + tail(fw, s * 0.55, L * 0.12, 35);
  } else if (sp.shape === "prop" || sp.shape === "prop4") {
    const fw = L * 0.1, y0 = L * 0.37, cr = L * 0.11;
    body = fuselage(fw, 0.15) + wing(fw, y0, cr, cr * 0.6, 2) + tail(fw, s * 0.3, L * 0.11, 8);
    const xs = sp.shape === "prop4" ? [s * 0.17, s * 0.31] : [s * 0.18];
    xs.forEach((x) => {
      const nw = fw * 0.33, top = y0 - L * 0.1, bot = y0 + cr * 1.1;
      [x, -x].forEach((cx) => {
        extra += `<rect x="${cx - nw/2}" y="${top}" width="${nw}" height="${bot - top}" rx="${nw/2}" fill="var(--plane2)"/>`;
        extra += `<path d="M${cx - s*0.065} ${top - 0.2} L${cx + s*0.065} ${top - 0.2}" stroke="var(--plane2)" stroke-width="${s*0.008}" stroke-linecap="round"/>`;
      });
    });
  } else {
    // straalvliegtuigen
    const wide = s > 45, fw = L * (wide ? 0.088 : 0.1), sweep = sp.shape === "tail" ? 27 : (wide ? 31 : 25);
    const y0 = L * (sp.shape === "tail" ? 0.4 : 0.36), cr = L * (wide ? 0.2 : 0.19);
    body = fuselage(fw) + wing(fw, y0, cr, cr * 0.26, sweep) + tail(fw, s * (sp.shape === "tail" ? 0.36 : 0.33), L * 0.1, 33);
    // winglets / sharklets: klein stukje aan de tip
    if (sp.shape === "tail") {
      const ew = fw * 0.42, el = L * 0.12, ey = L * 0.66;
      [1, -1].forEach((sgn) => extra += `<rect x="${sgn > 0 ? fw/2 - 0.1 : -fw/2 - ew + 0.1}" y="${ey}" width="${ew}" height="${el}" rx="${ew/2}" fill="var(--plane2)"/>`);
    } else {
      const xs = sp.shape === "jet4" ? [s * 0.2, s * 0.35] : [s * (wide ? 0.17 : 0.18)];
      const ew = wide ? Math.max(2.4, s * 0.05) : Math.max(1.6, s * 0.058), el = cr * (wide ? 0.62 : 0.72);
      xs.forEach((x) => {
        const yle = leAt(x, y0, fw, sweep);
        [x, -x].forEach((cx) => extra += `<rect x="${cx - ew/2}" y="${yle - el*0.62}" width="${ew}" height="${el}" rx="${ew*0.4}" fill="var(--plane2)"/>`);
      });
    }
  }
  return { svg: body + extra, top: -0.5, bottom: L + 0.3, left: -h, right: h };
}

function drawPlane(sp, k) {
  const g = plan(sp);
  const pad = 0.6;
  const w = (g.right - g.left + pad * 2), hgt = (g.bottom - g.top + pad * 2);
  return `<svg width="${(w*k).toFixed(1)}" height="${(hgt*k).toFixed(1)}" viewBox="${g.left - pad} ${g.top - pad} ${w} ${hgt}" role="img" aria-label="${esc(sp.model)}, spanwijdte ${sp.span} meter"><g fill="var(--plane)">${g.svg}</g></svg>`;
}


/* ---------- Zijaanzicht als potloodsilhouet (als er geen foto is) ---------- */
function side(sp, widthPx) {
  const L = sp.len, H = L * 0.42, fh = L * 0.1;
  const y = H * 0.55; // romp-as
  let d = "", extra = "";
  if (sp.shape === "heli") {
    d = `<ellipse cx="${L*0.3}" cy="${y}" rx="${L*0.22}" ry="${fh*1.4}"/><path d="M${L*0.45} ${y-fh*0.4} L${L*0.95} ${y-fh*0.6} L${L*0.95} ${y-fh*0.2} L${L*0.45} ${y+fh*0.3}Z"/><path d="M${L*0.9} ${y-fh*1.8} L${L} ${y-fh*1.8} L${L*0.97} ${y-fh*0.2} L${L*0.92} ${y-fh*0.2}Z"/>`;
    extra = `<path d="M${L*0.3 - sp.span/2} ${y-fh*2.1} L${L*0.3 + sp.span/2} ${y-fh*2.1}" stroke="currentColor" stroke-width="${fh*0.18}"/><path d="M${L*0.3} ${y-fh*2.1} L${L*0.3} ${y-fh*1.3}" stroke="currentColor" stroke-width="${fh*0.25}"/>`;
  } else {
    const nose = fh * 1.3, tailUp = sp.shape === "ga" ? fh * 1.6 : fh * 2.1;
    d = `<path d="M0 ${y} C0 ${y-fh*0.55} ${nose*0.4} ${y-fh/2} ${nose} ${y-fh/2} L${L*0.8} ${y-fh/2} L${L} ${y-fh*0.35} L${L} ${y-fh*0.1} L${L*0.8} ${y+fh*0.25} L${nose} ${y+fh/2} C${nose*0.3} ${y+fh/2} 0 ${y+fh*0.3} 0 ${y}Z"/>`;
    d += `<path d="M${L*0.8} ${y-fh/2} L${L*0.93} ${y-fh/2-tailUp} L${L*0.99} ${y-fh/2-tailUp} L${L} ${y-fh*0.35}Z"/>`;
    d += `<path d="M${L*0.4} ${y+fh*0.2} L${L*0.62} ${y+fh*0.35} L${L*0.62} ${y+fh*0.5} L${L*0.4} ${y+fh*0.45}Z" opacity=".7"/>`;
    if (sp.shape === "jet" || sp.shape === "jet4") extra = `<ellipse cx="${L*0.4}" cy="${y+fh*0.75}" rx="${L*0.07}" ry="${fh*0.3}" opacity=".85"/>`;
    if (sp.shape === "tail") extra = `<ellipse cx="${L*0.74}" cy="${y-fh*0.55}" rx="${L*0.07}" ry="${fh*0.28}" opacity=".85"/>`;
    if (sp.shape === "prop" || sp.shape === "prop4") extra = `<ellipse cx="${L*0.36}" cy="${y-fh*0.3}" rx="${L*0.08}" ry="${fh*0.25}" opacity=".85"/><path d="M${L*0.28} ${y-fh*1.5} L${L*0.28} ${y+fh*0.9}" stroke="currentColor" stroke-width="${fh*0.06}"/>`;
    if (sp.shape === "ga") extra = `<path d="M${-fh*0.1} ${y-fh*1.3} L${-fh*0.1} ${y+fh*1.3}" stroke="currentColor" stroke-width="${fh*0.08}"/>`;
  }
  const pad = L * 0.06;
  return `<svg width="${widthPx.toFixed(0)}" viewBox="${-pad} ${-pad} ${L + pad*2} ${H + pad*2}" style="color:var(--ghost)" role="img" aria-label="${esc(sp.model)}"><g fill="currentColor">${d}${extra}</g></svg>`;
}

/* ---------- Bijschrift ---------- */
function motion(a) {
  if (a.onGround) return "aan de grond";
  const r = a.rate;
  if (r != null && r > 300) return "stijgt";
  if (r != null && r < -300) return "daalt";
  return "kruist";
}
function altLine(a) {
  if (a.onGround || a.alt == null) return motion(a);
  return `${nf.format(Math.round(a.alt / 25) * 25)} ft, ${motion(a)}`;
}
function routeLine(a) {
  if (a.route) return `${a.route.from.city || a.route.from.iata} naar ${a.route.to.city || a.route.to.iata}`;
  if (!a.onGround && a.alt != null && a.alt < 4000 && a.rate != null && a.rate < -300) return "in nadering";
  return "trekt voorbij";
}

/* ---------- Foto's: eerst rechtstreeks vanuit de browser, anders via onze server ---------- */
const photos = new Map(); // hex -> foto-object of null (geen foto)
try { const c = JSON.parse(localStorage.getItem("overhead.photos") || "{}"); const now = Date.now();
  for (const [h, v] of Object.entries(c)) if (now - v.at < 3 * 86400e3) photos.set(h, v.p); } catch (e) {}
function persistPhotos() { try { const o = {}, now = Date.now(); let n = 0;
  for (const [h, p] of [...photos].slice(-400)) { o[h] = { at: now, p }; n++; }
  localStorage.setItem("overhead.photos", JSON.stringify(o)); } catch (e) {} }
const pq = [], inQ = new Set(); let active = 0, direct = true, reRenderT;
function queuePhoto(hex) { if (photos.has(hex) || inQ.has(hex)) return; inQ.add(hex); pq.push(hex); pump(); }
function pump() {
  while (active < 2 && pq.length) {
    const hex = pq.shift(); active++;
    fetchPhoto(hex).then((p) => {
      if (p !== undefined) { photos.set(hex, p); persistPhotos(); }
      clearTimeout(reRenderT); reRenderT = setTimeout(() => last && render(last), 250);
    }).finally(() => { active--; inQ.delete(hex); setTimeout(pump, 150); });
  }
}
async function fetchPhoto(hex) {
  const shape = (ph) => { const b = ph && (ph.thumbnail_large || ph.thumbnail); return b?.src ? { src: b.src, by: ph.photographer, link: ph.link } : null; };
  if (direct) {
    try {
      const r = await fetch(`https://api.planespotters.net/pub/photos/hex/${hex}`);
      if (r.ok) return shape((await r.json())?.photos?.[0]);
    } catch (e) { direct = false; } // CORS of geblokkeerd: vanaf nu via de server
  }
  try {
    const r = await fetch(`/api/photo?hex=${hex}`);
    if (r.ok) return (await r.json()).photo;
  } catch (e) {}
  return undefined; // onbekend, later opnieuw proberen
}


/* ---------- De prent ---------- */
let last = null, lastOk = 0;
function render(data) {
  const fleet = $("fleet");
  const usePhotos = cfg.view !== "silhouet";
  const list = (data?.aircraft || []).map((a) => ({ ...a, sp: spec(a), photo: photos.get(a.hex) || null }));
  if (usePhotos) list.forEach((a) => queuePhoto(a.hex));
  if (!list.length) {
    fleet.innerHTML = `<div class="empty"><b>Een lege hemel</b>Niets binnen ${cfg.radius} km. Over een halve minuut kijken we opnieuw.</div>`;
    return;
  }
  // Groot naar klein, maar afwisselend gelegd zodat de prent niet als een lijst oogt
  list.sort((a, b) => b.sp.span - a.sp.span);
  const order = [];
  list.forEach((a, i) => (i % 2 ? order.push(a) : order.unshift(a)));
  const big = order.splice(order.indexOf(list[0]), 1)[0];
  order.unshift(big);

  const html = (k) => order.map((a) => {
    // Een foto toont het toestel op ongeveer 75% van de beeldbreedte; silhouetten tekenen we op de romplengte
    const w = Math.max(90, a.sp.span * k);
    const s = Math.max(0.85, Math.min(1.35, w / 260));
    const name = a.callsign || a.reg || a.hex.toUpperCase();
    const img = usePhotos && a.photo
      ? `<img src="${esc(a.photo.src)}" width="${(w / 0.75).toFixed(0)}" height="${(w / 0.75 / 1.5).toFixed(0)}" style="aspect-ratio:3/2;object-fit:cover" alt="${esc(a.sp.model)} ${esc(a.reg || "")}" referrerpolicy="no-referrer" loading="lazy">`
      : side(a.sp, w * Math.min(1.1, a.sp.len / a.sp.span));
    return `<figure class="ac" style="--s:${s.toFixed(2)};margin:0">
      ${img}
      <figcaption class="cap"><b>${esc(name)}</b><i>${esc(a.sp.model)}</i><i>${esc(altLine(a))}</i><i>${esc(routeLine(a))}</i>${usePhotos && a.photo?.by ? `<i class="credit">foto <a href="${esc(a.photo.link)}" target="_blank" rel="noopener">${esc(a.photo.by)}</a></i>` : ""}</figcaption>
    </figure>`;
  }).join("");

  // Schaal zoeken zodat alles op één scherm past (op brede schermen); op een telefoon mag je scrollen
  const main = $("main");
  const availW = fleet.parentElement.clientWidth;
  const maxSpan = list[0].sp.span;
  let hi = (availW * 0.55) / maxSpan, lo = 1;
  const fits = () => main.scrollHeight <= main.clientHeight + 1 && fleet.scrollWidth <= availW + 1;
  if (innerWidth >= 700) {
    for (let i = 0; i < 9; i++) {
      const mid = (lo + hi) / 2;
      fleet.innerHTML = html(mid);
      if (fits()) lo = mid; else hi = mid;
    }
    fleet.innerHTML = html(lo);
  } else {
    fleet.innerHTML = html(Math.min(hi, (availW * 0.8) / maxSpan));
  }
}

function header() {
  $("title").textContent = (cfg.title || "Overhead").toUpperCase();
  $("radiusTxt").textContent = `BINNEN ${cfg.radius} KM`;
  $("place").textContent = cfg.place || `${cfg.lat.toFixed(3).replace(".", ",")}° N, ${cfg.lon.toFixed(3).replace(".", ",")}° O`;
  document.title = cfg.title || "Overhead";
  tick();
}
function tick() {
  const d = new Date();
  const t = d.toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" });
  const day = d.toLocaleDateString("nl-BE", { weekday: "short", day: "numeric", month: "short" }).replace(/\./g, "");
  $("when").textContent = `${t} · ${day}`;
}

async function load() {
  try {
    const r = await fetch(`/api/aircraft?lat=${cfg.lat}&lon=${cfg.lon}&radius=${cfg.radius}`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Fout bij ophalen");
    last = j; lastOk = Date.now();
    render(j);
  } catch (e) {
    if (!last) $("fleet").innerHTML = `<div class="empty"><b>Geen verbinding</b>${esc(e.message)} We proberen het zo opnieuw.</div>`;
  }
}

/* ---------- Instellingen-dialoog ---------- */
const dlg = $("dlg");
function openSettings() {
  $("f-title").value = cfg.title; $("f-lat").value = cfg.lat; $("f-lon").value = cfg.lon;
  $("f-rad").value = cfg.radius; $("f-view").value = cfg.view; $("f-radv").textContent = cfg.radius + " km";
  $("f-search").value = cfg.place || ""; $("results").innerHTML = ""; $("f-msg").textContent = "";
  dlg.showModal();
}
$("gear").addEventListener("click", openSettings);
$("f-rad").addEventListener("input", (e) => $("f-radv").textContent = e.target.value + " km");
let pendingPlace = cfg.place, searchT;
$("f-search").addEventListener("input", (e) => {
  clearTimeout(searchT);
  const q = e.target.value.trim();
  if (q.length < 2) { $("results").innerHTML = ""; return; }
  searchT = setTimeout(async () => {
    try {
      const r = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
      const j = await r.json();
      $("results").innerHTML = (j.results || []).map((p, i) => `<button type="button" data-i="${i}">${esc(p.name)}<small>${esc(p.region)}</small></button>`).join("") || `<p class="hint">Niets gevonden.</p>`;
      $("results").querySelectorAll("button").forEach((b) => b.onclick = () => {
        const p = j.results[+b.dataset.i];
        $("f-lat").value = p.lat.toFixed(4); $("f-lon").value = p.lon.toFixed(4);
        pendingPlace = p.name; $("f-search").value = p.name; $("results").innerHTML = "";
      });
    } catch (err) { $("results").innerHTML = `<p class="hint">Zoeken lukt nu niet.</p>`; }
  }, 300);
});
$("f-geo").addEventListener("click", () => {
  if (!navigator.geolocation) { $("f-msg").textContent = "Dit toestel kan zijn locatie niet doorgeven."; return; }
  $("f-msg").textContent = "Locatie opvragen…";
  navigator.geolocation.getCurrentPosition(
    (p) => { $("f-lat").value = p.coords.latitude.toFixed(4); $("f-lon").value = p.coords.longitude.toFixed(4); pendingPlace = ""; $("f-search").value = ""; $("f-msg").textContent = "Locatie ingevuld."; },
    () => { $("f-msg").textContent = "Toegang tot de locatie is geweigerd. Zoek de plaats op naam."; },
    { timeout: 10000 }
  );
});
$("f-save").addEventListener("click", () => {
  const lat = parseFloat(String($("f-lat").value).replace(",", ".")), lon = parseFloat(String($("f-lon").value).replace(",", "."));
  if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) { $("f-msg").textContent = "Vul een geldige breedte- en lengtegraad in."; return; }
  cfg = { title: $("f-title").value.trim(), place: pendingPlace || "", lat, lon, radius: +$("f-rad").value, view: $("f-view").value };
  saveCfg(); header(); dlg.close(); last = null;
  $("fleet").innerHTML = `<div class="empty"><b>Luchtruim afluisteren…</b>Even geduld.</div>`;
  history.replaceState(null, "", location.pathname);
  load();
});


/* Scherm aan houden op een tablet */
async function wake() { try { await navigator.wakeLock?.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) { wake(); load(); } });

let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => last && render(last), 150); });
header(); load(); wake();
setInterval(load, 30000);
setInterval(tick, 15000);
})();
</script>
</body>
